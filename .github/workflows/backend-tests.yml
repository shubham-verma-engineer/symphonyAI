name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes an in-flight run pointless.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # pgvector is required: V1__init_schema.sql creates the vector extension
      # and an HNSW index on agents.description_embedding.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symphony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symphony"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Dev-mode Vault for SecretsVaultContractTest. The image's default
      # command is `server -dev`; VAULT_ADDR lets the health check reach it
      # over plain HTTP.
      vault:
        image: hashicorp/vault:1.17
        env:
          VAULT_DEV_ROOT_TOKEN_ID: symphony-dev-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          VAULT_ADDR: http://127.0.0.1:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: symphony-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle and validates the wrapper jar against Gradle's published
      # checksums before it is executed.
      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        env:
          VAULT_URI: http://localhost:8200
          VAULT_TOKEN: symphony-dev-root-token
        run: ./gradlew test --no-daemon

      # SecretsVaultContractTest skips its Vault-backed half when no Vault is
      # reachable, so the suite would stay green if the Vault service broke.
      # In CI Vault is always provided, so any skip means lost coverage, not an
      # optional test.
      - name: Fail if any test was skipped
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          results = glob.glob('build/test-results/test/TEST-*.xml')
          if not results:
              sys.exit("No test results found — the test task did not run.")
          tests = skipped = 0
          for path in results:
              suite = ET.parse(path).getroot()
              tests += int(suite.get('tests'))
              skipped += int(suite.get('skipped'))
              for case in suite.iter('testcase'):
                  if case.find('skipped') is not None:
                      print(f"::error::Skipped: {case.get('classname')} > {case.get('name')}")
          print(f"{tests} tests, {skipped} skipped")
          sys.exit(1 if skipped else 0)
          PY

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: symphony-backend/build/reports/tests/test
          retention-days: 14
