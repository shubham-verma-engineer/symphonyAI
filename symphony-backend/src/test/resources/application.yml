# Test configuration. Replaces the main application.yml entirely on the test
# classpath, so it must carry everything the context needs.
#
# Mock mode is on: the suite runs offline, with seeded embeddings and bypassed
# outbound agent calls, and the development accounts are seeded so that
# authentication tests have credentials to verify against.
server:
  port: 0

spring:
  application:
    name: symphony-backend-test

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/symphony}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

openai:
  # Still the literal "mock-key" because the service-layer mock branching is
  # keyed off this value until Phase 6 of plan 0007 moves it onto
  # symphony.mock.enabled. Once that lands, this can become any placeholder.
  api-key: mock-key
  embedding-model: text-embedding-3-small

symphony:
  mock:
    enabled: true
  dev:
    seed-password: test-seed-password
  jwt:
    secret: dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLXN5bXBob255LWFpLWp3dC10b2tlbi1nZW5lcmF0aW9uLXdpdGgtMzItYnl0ZXM=
    expiration-ms: 86400000
  vault:
    encryption-key: test-only-local-vault-encryption-key
