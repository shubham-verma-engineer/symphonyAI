server:
  port: 8091
  error:
    include-message: always

spring:
  application:
    name: symphony-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/symphony}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Let Flyway handle migrations, validate entity mapping on start
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

openai:
  api-key: ${OPENAI_API_KEY:mock-key}
  embedding-model: text-embedding-3-small

symphony:
  # Explicit opt-in to local mock behaviour. Defaults to false so that
  # production behaviour is what you get unless someone asks for otherwise.
  # See docs/implementation-plans/0007-production-hardening-blockers.md.
  mock:
    enabled: ${SYMPHONY_MOCK_ENABLED:false}

  dev:
    # Password for the seeded development accounts. Only read when mock mode is
    # on; without it, no accounts are seeded. Has no default on purpose, so no
    # usable credential is ever committed to this repository.
    seed-password: ${SYMPHONY_DEV_SEED_PASSWORD:}

  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLXN5bXBob255LWFpLWp3dC10b2tlbi1nZW5lcmF0aW9uLXdpdGgtMzItYnl0ZXM=}
    expiration-ms: 86400000 # 24 hours
