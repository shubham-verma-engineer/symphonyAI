server:
  port: 8091
  error:
    include-message: always

spring:
  application:
    name: symphony-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/symphony}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Let Flyway handle migrations, validate entity mapping on start
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

openai:
  # No default. An absent key used to fall back to a sentinel value (mock-key)
  # which silently switched routing and search onto seeded local fakes. Mocking
  # is now chosen explicitly via symphony.mock.llm.
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-3-small

symphony:
  # Explicit opt-in to local mock behaviour. Defaults to false so that
  # production behaviour is what you get unless someone asks for otherwise.
  # See docs/implementation-plans/0007-production-hardening-blockers.md.
  mock:
    enabled: ${SYMPHONY_MOCK_ENABLED:false}
    # Leave unset to follow mock.enabled. Set false to run the rest of the
    # platform offline against a real LLM (needs OPENAI_API_KEY).
    llm: ${SYMPHONY_MOCK_LLM:}

  vault:
    # HashiCorp Vault connection, used outside mock mode. No usable defaults:
    # a production instance must be told where its Vault is and must supply a
    # token, and ConfigurationGuard refuses to start without them.
    uri: ${VAULT_URI:}
    token: ${VAULT_TOKEN:}
    kv-mount: ${VAULT_KV_MOUNT:secret}
    # Only read by the in-memory vault in mock mode.
    encryption-key: ${SYMPHONY_VAULT_ENCRYPTION_KEY:this-is-a-32-byte-encryption-key-for-local-vault}

  heartbeat:
    interval-ms: ${SYMPHONY_HEARTBEAT_INTERVAL_MS:30000}
    # Leave unset to follow mock mode. Set explicitly to probe real endpoints
    # while the rest of the platform runs offline, or to stop probing without
    # faking anything else.
    assume-healthy: ${SYMPHONY_HEARTBEAT_ASSUME_HEALTHY:}

  dev:
    # Password for the seeded development accounts. Only read when mock mode is
    # on; without it, no accounts are seeded. Has no default on purpose, so no
    # usable credential is ever committed to this repository.
    seed-password: ${SYMPHONY_DEV_SEED_PASSWORD:}

  jwt:
    expiration-ms: 86400000 # 24 hours
    # RS256 signing keys are generated by the application and persisted to the
    # configured vault. No key material lives in this file: the previous
    # committed HS256 secret was also the verifying key, so holding this
    # repository was enough to mint a token for any user, role and workspace.
    vault-path: ${JWT_KEYRING_VAULT_PATH:symphony/jwt/keyring}
    # docs/SECRETS-MANAGEMENT.md section 4: rotate every 90 days, and keep the
    # previous key verifying for 24 hours so sessions drain gracefully.
    rotation-period-days: ${JWT_ROTATION_PERIOD_DAYS:90}
    rotation-overlap-hours: ${JWT_ROTATION_OVERLAP_HOURS:24}
